name: Python Service CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: services/ml/requirements.txt

      - name: Install dependencies
        run: pip install -r services/ml/requirements.txt

      - name: Cache HuggingFace models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-distilbert-${{ runner.os }}-${{ matrix.python-version }}

      - name: Run pytest
        run: pytest services/ml/tests/ -v --tb=short --cov=services/ml/app --cov-report=xml:coverage.xml
        env:
          PYTHONPATH: .

      - uses: codecov/codecov-action@v5
        if: matrix.python-version == '3.11'
        with:
          files: coverage.xml
          flags: python
          use_oidc: true
          fail_ci_if_error: false

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Build service image
        run: docker build -t rinstagram:ci services/ml/
