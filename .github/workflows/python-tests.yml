name: Python Services CI

on:
  push:
    branches: [main, master, develop]
    paths:
      - 'services/**'
  pull_request:
    branches: [main, master]
    paths:
      - 'services/**'

jobs:
  crypto-service:
    name: Crypto Service Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: services/crypto/requirements.txt

      - name: Install dependencies
        run: pip install -r services/crypto/requirements.txt
        working-directory: .

      - name: Run pytest
        run: pytest services/crypto/tests/ -v --tb=short --cov=services/crypto/app --cov-report=xml:coverage-crypto.xml
        env:
          PYTHONPATH: .

      - uses: codecov/codecov-action@v4
        with:
          files: coverage-crypto.xml
          flags: crypto
          token: ${{ secrets.CODECOV_TOKEN }}

  ml-service:
    name: ML Service Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: services/ml/requirements.txt

      - name: Install dependencies
        run: pip install -r services/ml/requirements.txt
        working-directory: .

      - name: Cache HuggingFace models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-distilbert-${{ runner.os }}

      - name: Run pytest
        run: pytest services/ml/tests/ -v --tb=short --cov=services/ml/app --cov-report=xml:coverage-ml.xml
        env:
          PYTHONPATH: .
          TRANSFORMERS_OFFLINE: "0"

      - uses: codecov/codecov-action@v4
        with:
          files: coverage-ml.xml
          flags: ml
          token: ${{ secrets.CODECOV_TOKEN }}

  docker-build:
    name: Docker Build Check
    runs-on: ubuntu-latest
    needs: [crypto-service, ml-service]
    steps:
      - uses: actions/checkout@v4

      - name: Build crypto service image
        run: docker build -t rinstagram-crypto:ci services/crypto/

      - name: Build ML service image
        run: docker build -t rinstagram-ml:ci services/ml/
