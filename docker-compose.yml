version: "3.9"

services:
  rinstagram:
    build:
      context: services/ml
      dockerfile: Dockerfile
    image: rinstagram:latest
    container_name: rinstagram
    ports:
      - "8001:8001"
    environment:
      - PYTHONUNBUFFERED=1
      - TORCH_DEVICE=cpu
    volumes:
      - rinstagram-weights:/service/weights
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 30s
      timeout: 30s
      retries: 5
      start_period: 120s
    restart: unless-stopped

volumes:
  rinstagram-weights:
    driver: local
